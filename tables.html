<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

        }

        table {
            width: 63%;
            border: 1px solid black;
            margin: auto;
            border-collapse: collapse;
        }

        th {
            color: black;
            border: 1px solid black;
            padding: 12px 8px;
            text-align: left;
            background-color: darkseagreen;

        }

        td {
            color: black;
            border: 1px solid black;
            padding: 12px 8px;
            text-align: left;

        }

        .salary {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>

        </thead>
        <tr>
            <td>Jane</td>
            <td>Doe</td>
            <td>Nairobi</td>
            <td>21</td>
            <td class="salary">60,000</td>
        </tr>
        <tr>
            <td>Jack</td>
            <td>Mwangi</td>
            <td>Mombasa</td>
            <td>33</td>
            <td class="salary">67,000</td>
        </tr>
        <tr>
            <td>William</td>
            <td>Ndinda</td>
            <td>Mombasa</td>
            <td>43</td>
            <td class="salary">20,000</td>
        </tr>
        <tr>
            <td>James</td>
            <td>Kamau</td>
            <td>Eldoret</td>
            <td>25</td>
            <td class="salary">80,000</td>
        </tr>
        <tbody>


        </tbody>

    </table>

    <!-- Unordered List -->
    <ol>
        <li>Mombasa</li>
        <li>Eldoret</li>
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Nyeri</li>
    </ol>

</body>

</html>
